name: Plugin checks

on:
  pull_request:
  push:
    branches: [main, codex/calendar-workbench]

permissions:
  contents: read

jobs:
  discourse:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Complete specs on production Core
            repository: ISBF-Lab/ISBFweb
            ref: 132cc95d043db01251eedf9c93b3927cd5ffee91
            specs: plugins/isbf-calendar/spec
          - name: Subscription adapter on upstream Core
            repository: discourse/discourse
            ref: main
            specs: plugins/isbf-calendar/spec/requests/isbf_calendar/subscriptions_controller_spec.rb plugins/isbf-calendar/spec/lib/isbf_calendar/subscription_feed_spec.rb
    container: discourse/discourse_test:slim
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RAILS_ENV: test
      LOAD_PLUGINS: "1"
      PGUSER: discourse
      PGPASSWORD: discourse
    steps:
      - name: Set working directory owner
        run: chown root:root .
      # This fork contains the real academy identity settings and Guardian extensions.
      - name: Checkout production Core
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          ssh-key: ${{ matrix.repository == 'ISBF-Lab/ISBFweb' && secrets.ISBF_CORE_READ_KEY || '' }}
          persist-credentials: false
      - name: Checkout plugin under test
        uses: actions/checkout@v4
        with:
          path: plugins/isbf-calendar
          persist-credentials: false
      - name: Start Redis
        run: redis-server /etc/redis/redis.conf --daemonize yes --logfile ""
      - name: Start Postgres
        run: |
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE $PGUSER LOGIN SUPERUSER PASSWORD '$PGPASSWORD';"
      - name: Cache Ruby dependencies
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-isbf-calendar-gems-${{ matrix.repository }}-${{ hashFiles('Gemfile.lock') }}
      - name: Install gems
        run: |
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without development
          bundle install --jobs 2
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-isbf-core-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Create and migrate test database
        run: bundle exec rake db:create db:migrate
      - name: Run plugin specs
        run: bundle exec rspec ${{ matrix.specs }}
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: find . -path './.git' -prune -o -name '*.rb' -print -exec ruby -c '{}' \;
